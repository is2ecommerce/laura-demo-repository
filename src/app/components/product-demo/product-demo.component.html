<div class="product-demo">
  <h2>Productos Disponibles</h2>
  <p>Haz clic en "Agregar al carrito" para probar el componente del carrito</p>
  
  <div class="products-grid">
    <div class="product-card" *ngFor="let product of products">
      <div class="product-image">
        <img [src]="product.image" [alt]="product.name" loading="lazy">
        <div class="discount-badge" *ngIf="hasDiscount(product)">
          -{{ getDiscountPercentage(product) }}%
        </div>
      </div>
      
      <div class="product-info">
        <h3 class="product-name">{{ product.name }}</h3>
        <p class="product-description">{{ product.description }}</p>
        
        <div class="product-price">
          <span class="current-price">{{ formatPrice(product.price) }}</span>
          <span class="original-price" *ngIf="hasDiscount(product)">
            {{ formatPrice(product.originalPrice!) }}
          </span>
        </div>
        
        <button class="btn btn-primary btn-add-cart" (click)="addToCart(product)">
          Agregar al Carrito
        </button>
      </div>
    </div>
  </div>
</div>
