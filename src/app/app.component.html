<div class="app">
  <header class="app-header">
    <h1>{{ title }}</h1>
    <nav class="app-nav">
      <button 
        class="btn btn-secondary" 
        [class.active]="!showCart"
        (click)="showCart = false">
        Productos
      </button>
      <button 
        class="btn btn-secondary" 
        [class.active]="showCart"
        (click)="showCart = true">
        Carrito
      </button>
    </nav>
  </header>

  <main class="app-main">
    <app-product-demo *ngIf="!showCart"></app-product-demo>
    <app-shopping-cart *ngIf="showCart"></app-shopping-cart>
  </main>

  <footer class="app-footer">
    <p>&copy; 2025 E-Commerce Demo. Carrito de compras implementado con Angular.</p>
  </footer>
</div>
